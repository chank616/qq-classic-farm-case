<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOADING_WINDOW</title>
  </head>

  <body>
    <style>
      html,
      body {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .logo {
        width: 72px;
        height: 72px;
      }
      .title {
        font-size: 16px;
      }

      .loading,
      .loading > div {
        position: relative;
        box-sizing: border-box;
      }

      .loading {
        display: block;
        font-size: 0;
        color: #6a6868;
      }

      .loading > div {
        display: inline-block;
        float: none;
        background-color: currentColor;
        border: 0 solid currentColor;
      }

      .loading {
        width: 54px;
        height: 18px;
      }

      .loading > div {
        width: 8px;
        height: 8px;
        margin: 4px;
        border-radius: 100%;
        animation: ball-beat 1s -0.15s infinite linear;
      }

      .loading > div:nth-child(2n-1) {
        animation-delay: -0.5s;
      }

      @keyframes ball-beat {
        50% {
          opacity: 0.2;
          transform: scale(0.75);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .status {
        position: absolute;
        bottom: 8%;
        font-size: 14px;
        max-width: 80%;
        margin-top: 20px;
        text-align: center;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        color: rgba(0, 0, 0, 0.6);
      }
    </style>
    <div class="content">
      <img src="./logo.png" class="logo" alt="" srcset="" />
      <p class="title">QQ小程序 | 小游戏</p>
      <div class="loading">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="status"></div>
    </div>
    <script>
      window.electron.onLoadingStatusChange((status) => {
        document.querySelector('.status').textContent = status;
      });
    </script>
  </body>
</html>
